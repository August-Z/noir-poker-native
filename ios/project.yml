name: NoirPoker
options:
  bundleIdPrefix: com.august
  deploymentTarget:
    iOS: "17.0"
packages:
  PokerCore:
    path: Packages/PokerCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  NoirPoker:
    type: application
    platform: iOS
    sources:
      - NoirPoker
      # Manrope (SIL Open Font License 1.1) and its license text, copied to
      # the app bundle root; Config/NoirPoker-Info.plist registers the fonts.
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PokerCore
    settings:
      base:
        # Merged with the generated Info.plist; it only adds UIAppFonts.
        INFOPLIST_FILE: Config/NoirPoker-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.august.noirpoker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: NOIR Poker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad multitasking requires all four orientations.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  NoirPokerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NoirPokerUITests]
    dependencies:
      - target: NoirPoker
schemes:
  NoirPoker:
    build:
      targets:
        NoirPoker: all
    test:
      targets: [NoirPokerUITests]
