name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repair_history:
        description: One-time owner-requested correction of starter commit email
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Prepare source and verify instruction link
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Expand initial source bundle once
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ -f bootstrap.py ]; then
            test "$EVENT_NAME" = push -o "$EVENT_NAME" = workflow_dispatch
            test "$REF_NAME" = refs/heads/main
            test ! -d android
            python3 bootstrap.py
            chmod +x gradlew scripts/*.sh
            git rm bootstrap.py
            git add .
            git -c user.name='August-Z' -c user.email='zoushicheng0911@gmail.com' commit -m 'Initialize independent native Android and iOS development projects'
            git push origin HEAD:main
          fi
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = AGENTS.md
          test "$(git ls-files --stage CLAUDE.md | cut -d ' ' -f 1)" = 120000
      - name: Apply owner-requested commit identity correction
        id: identity
        env:
          REPAIR_HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_history }}
        run: |
          if [ "$REPAIR_HISTORY" = true ]; then
            python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          email = 'zoushicheng0911@gmail.com'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          original_remote = git('rev-parse', 'refs/remotes/origin/main')
          git('config', 'user.name', 'August-Z')
          git('config', 'user.email', email)
          notes = {
              'AGENTS.md': '\n- Use `zoushicheng0911@gmail.com` for every new commit. Set repository-local Git identity before committing and verify author and committer emails. Do not use a noreply address or bot identity.\n',
              'docs/HANDOFF.md': '\nUse `zoushicheng0911@gmail.com` for every new commit. Before committing, run `git config user.name August-Z` and `git config user.email zoushicheng0911@gmail.com` in this repository. Verify both author and committer emails. Do not use another email, a GitHub noreply address, or a bot identity. The starter commit identities have been corrected at the owner\'s request; do not perform unrelated history rewrites.\n'
          }
          for filename, note in notes.items():
              file = Path(filename)
              text = file.read_text()
              if email not in text:
                  file.write_text(text + note)
          setup = Path('scripts/setup.sh')
          setup_text = setup.read_text()
          if email not in setup_text:
              setup.write_text(setup_text.replace('chmod +x gradlew scripts/*.sh', 'git config user.name August-Z\ngit config user.email ' + email + '\nchmod +x gradlew scripts/*.sh'))
          git('add', 'AGENTS.md', 'docs/HANDOFF.md', 'scripts/setup.sh')
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
              git('commit', '-m', 'Document required commit email for Claude Code handoff')
          old_commits = git('rev-list', '--reverse', 'HEAD').splitlines()
          rewritten = {}
          for old in old_commits:
              values = git('show', '-s', '--format=%T%x00%an%x00%aI%x00%cn%x00%cI%x00%P', old).split('\0')
              tree, author, author_date, committer, committer_date, parents = values
              message = subprocess.check_output(['git', 'show', '-s', '--format=%B', old])
              env = os.environ.copy()
              env.update(GIT_AUTHOR_NAME=author, GIT_AUTHOR_EMAIL=email, GIT_AUTHOR_DATE=author_date, GIT_COMMITTER_NAME=committer, GIT_COMMITTER_EMAIL=email, GIT_COMMITTER_DATE=committer_date)
              args = ['commit-tree', tree]
              for parent in parents.split():
                  args += ['-p', rewritten[parent]]
              rewritten[old] = git(*args, input=message, env=env)
          tip = rewritten[old_commits[-1]]
          assert git('rev-parse', 'HEAD^{tree}') == git('rev-parse', tip + '^{tree}')
          git('push', '--force-with-lease=refs/heads/main:' + original_remote, 'origin', tip + ':refs/heads/main')
          git('reset', '--hard', tip)
          assert all(line == email + ' ' + email for line in git('log', '--format=%ae %ce').splitlines())
          print('Starter history replayed with the required author and committer email; file tree unchanged.')
          PY
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  reference:
    name: Pinned reference tests and fixtures
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bash scripts/fetch-reference.sh
      - run: node scripts/generate-reference-fixtures.mjs --check
      - run: node --test tests/unit/*.test.js
        working-directory: .reference/noir-poker

  android:
    name: Android build and Kotlin tests
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test native Kotlin domain against shared fixtures
        run: |
          chmod +x gradlew
          ./gradlew -p android/core test --stacktrace
      - name: Test and build native Android
        run: ./gradlew :android:app:testDebugUnitTest :android:app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: noir-poker-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-ui:
    name: Android native UI smoke test
    needs: [source, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :android:app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-ui-test-results
          path: android/app/build/reports/androidTests/

  ios:
    name: iOS build, Swift tests, and simulator launch
    needs: source
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Prepare native Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Test native Swift core
        # Optimized build with testability: the review and simulation fixtures
        # take over 20 minutes in a debug build on hosted macOS runners.
        run: swift test --package-path ios/Packages/PokerCore -c release -Xswiftc -enable-testing
      - name: Generate and build Xcode project
        run: |
          xcodegen generate --spec ios/project.yml
          xcodebuild -project ios/NoirPoker.xcodeproj -scheme NoirPoker -sdk iphonesimulator -configuration Debug -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Launch and test on an iOS simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,devices in data.items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" .build/ios/Build/Products/Debug-iphonesimulator/NoirPoker.app
          xcrun simctl launch "$device_id" com.august.noirpoker
          xcodebuild -project ios/NoirPoker.xcodeproj -scheme NoirPoker -destination "id=$device_id" -derivedDataPath .build/ios -resultBundlePath .build/ios-ui-results CODE_SIGNING_ALLOWED=NO test
          xcrun simctl launch "$device_id" com.august.noirpoker
          xcrun simctl io "$device_id" screenshot .build/ios-simulator.png
          xcrun simctl shutdown "$device_id" || true
          ditto -c -k --keepParent .build/ios/Build/Products/Debug-iphonesimulator/NoirPoker.app .build/NoirPoker-simulator.zip
      - name: Run the tablet layout UI test on an iPad simulator
        run: |
          ipad_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; pads=[d for runtime,devices in data.items() if "iOS" in runtime for d in devices if "iPad" in d["name"]]; pads.sort(key=lambda d: 0 if "iPad Pro" in d["name"] else 1); print(pads[0]["udid"])')
          xcrun simctl boot "$ipad_id" || true
          xcrun simctl bootstatus "$ipad_id" -b
          xcodebuild -project ios/NoirPoker.xcodeproj -scheme NoirPoker -destination "id=$ipad_id" -derivedDataPath .build/ios -resultBundlePath .build/ios-ipad-ui-results CODE_SIGNING_ALLOWED=NO -only-testing:NoirPokerUITests/TabletLayoutTests test
          xcrun simctl launch "$ipad_id" com.august.noirpoker
          xcrun simctl io "$ipad_id" screenshot .build/ios-ipad-simulator.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: noir-poker-ios-simulator
          path: |
            .build/NoirPoker-simulator.zip
            .build/ios-simulator.png
            .build/ios-ipad-simulator.png
            .build/ios-ui-results
            .build/ios-ipad-ui-results
          if-no-files-found: warn
